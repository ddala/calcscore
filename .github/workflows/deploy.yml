name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          # scp-action has no exclude input, so name the files that make up the
          # site. Anything not listed here stays off the web root - notably .git,
          # which is otherwise downloadable at /.git/config.
          source: "index.html,simulation.html,styles.css,shared.js,calc.js,simulation.js,icclogo.png"
          target: "/var/www/calcscore"
