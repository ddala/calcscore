<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCR2 Score Calculator</title>
    <link rel="icon" type="image/png" href="icclogo.png">
    <link rel="apple-touch-icon" href="icclogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
    <div id="errorAlert" role="alert"></div>

    <header class="navbar">
        <a class="navbar-brand" href="index.html">
            <img src="icclogo.png" alt="ICC">
            <span>HCR2 Score Calculator</span>
        </a>
        <nav class="navbar-nav" aria-label="Pages">
            <a href="index.html" aria-current="page">Calculator</a>
            <a href="simulation.html">Simulation</a>
        </nav>
        <div class="navbar-actions">
        <button type="button" class="btn-icon" id="openSettingsButton" aria-label="Settings">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="10" cy="10" r="3"/>
                <path d="M10 1.5v2M10 16.5v2M3.5 3.5l1.4 1.4M15.1 15.1l1.4 1.4M1.5 10h2M16.5 10h2M3.5 16.5l1.4-1.4M15.1 4.9l1.4-1.4"/>
            </svg>
        </button>
        </div>
    </header>

    <div class="container">
        <main id="calculatorView">
        <form id="teamCalculatorForm">
            <div class="form-row">
                <div>
                    <label for="teamCountSelect" class="form-label">Number of teams</label>
                    <select class="form-select" id="teamCountSelect">
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>
                <div>
                    <label for="totalPlayerCountInput" class="form-label">Total players</label>
                    <input type="text" class="form-control" id="totalPlayerCountInput" name="total" autocomplete="off" value="50">
                </div>
            </div>

            <div id="teamInputs"></div>

            <button type="button" class="btn btn-primary" id="calculateScoresButton">Calculate scores</button>
        </form>

        <div id="result" class="results-section hidden">
            <h3>Results</h3>
            <div id="resultList"></div>
        </div>

        <button id="copyButton" class="btn btn-ghost mt hidden">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="5" width="9" height="9" rx="1.5"/>
                <path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v6A1.5 1.5 0 003.5 11H5"/>
            </svg>
            Copy results
        </button>
        </main>

    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5>Settings</h5>
                <button type="button" class="modal-close" id="closeSettingsButton">&times;</button>
            </div>
            <div class="modal-body">
                <form id="settingsForm">
                    <div class="form-check">
                        <input type="checkbox" id="iccModeCheckbox" class="form-check-input" checked>
                        <label class="form-check-label" for="iccModeCheckbox">ICC Mode (1st spot gets 301 points)</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="sortScoresCheckbox" class="form-check-input">
                        <label class="form-check-label" for="sortScoresCheckbox">Sort scores (highest first)</label>
                    </div>
                    <div class="settings-row">
                        <label for="team1NameInput" class="form-label">Team 1</label>
                        <input type="text" class="form-control" id="team1NameInput">
                    </div>
                    <div class="settings-row">
                        <label for="team2NameInput" class="form-label">Team 2</label>
                        <input type="text" class="form-control" id="team2NameInput">
                    </div>
                    <div class="settings-row">
                        <label for="team3NameInput" class="form-label">Team 3</label>
                        <input type="text" class="form-control" id="team3NameInput">
                    </div>
                    <div class="settings-row">
                        <label for="team4NameInput" class="form-label">Team 4</label>
                        <input type="text" class="form-control" id="team4NameInput">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelSettingsButton">Close</button>
                <button type="button" class="btn btn-primary" id="saveSettingsButton">Save changes</button>
            </div>
        </div>
    </div>

    <script src="shared.js?v=1"></script>
    <script src="calc.js?v=11"></script>
    <script>
        // Keep older index.html#simulation bookmarks working.
        if (location.hash === '#simulation') location.replace('simulation.html');
    </script>
</body>
</html>
